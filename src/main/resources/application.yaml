spring:
  application:
    name: atool

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://192.168.5.3:3306/atool
    username: root
    password: 123

  data:
    redis:
      database: 0
      host: 192.168.5.3
      port: 6379



forest:
  backend: okhttp3

atool:
  captcha:
    captcha-code-len: 6
    types:
      - "email"
      - "phone"
    timeout: 60

  regcheck:
    regex:
        email: ^[^\s@]+@[^\s@]+\.[^\s@]+$
        phone: ^(?:(?:\+|00)86)?1(?:(?:3[\d])|(?:4[5-79])|(?:5[0-35-9])|(?:6[5-7])|(?:7[0-8])|(?:8[\d])|(?:9[01256789]))\d{8}$



mybatis:
  configuration:
    map-underscore-to-camel-case: true
  mapper-locations: classpath:mapper/*.xml